<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />

  <!-- Theme & Colors -->
  <meta name="theme-color" content="#ff5282" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f28367" media="(prefers-color-scheme: light)" />
  <meta name="background-color" content="#0f172a" />

  <!-- SEO -->
  <title>HSSE Tech | Meram Platform</title>
  <meta name="description"
    content="Platform HSE observasi lapangan terintegrasi. Laporkan, monitor, dan tindaklanjuti observasi keselamatan kerja secara real-time." />
  <meta name="keywords" content="HSE, HSSE, safety observation, K3, keselamatan kerja, laporan lapangan" />
  <meta name="author" content="Meram Technology" />
  <meta name="robots" content="noindex, nofollow" />

  <!-- PWA -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/logo.svg" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.svg" />

  <!-- Apple PWA meta -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HSSE Tech" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Open Graph (untuk share link) -->
  <meta property="og:title" content="HSSE Tech | Meram Platform" />
  <meta property="og:description"
    content="Platform HSE observasi lapangan terintegrasi untuk tim safety profesional." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="%PUBLIC_URL%/logo.svg" />

  <!-- Windows Tile -->
  <meta name="msapplication-TileColor" content="#0f172a" />
  <meta name="msapplication-config" content="none" />

  <!-- Preconnect untuk performa -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin />
  <link rel="dns-prefetch" href="https://script.google.com" />

  <style>
    /* ─── APP SHELL: tampil sebelum React load ─── */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      background-color: #0f172a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* Splash screen saat pertama load */
    #root:empty::before {
      content: '';
      display: block;
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      z-index: 9999;
    }

    /* Skeleton App Shell */
    #app-shell {
      display: flex;
      flex-direction: column;
      max-width: 448px;
      margin: 0 auto;
      min-height: 100vh;
      background: #0f172a;
      position: relative;
    }

    /* Loading spinner di tengah */
    #app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    #app-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* =========================================
       ANIMASI SPLASH SCREEN (Masuk / Entrance)
       ========================================= */
    .hsse-splash {
      animation: coreFloat 4s ease-in-out infinite;
      transform-origin: 50px 50px;
    }

    .logo-outline {
      stroke-dasharray: 800;
      animation: coreOutline 4s ease-out infinite;
      transform-origin: 50px 50px;
    }

    .logo-fill {
      animation: coreFill 4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      transform-origin: 50px 50px;
    }

    /* 1. Efek Mengambang & Glowing */
    @keyframes coreFloat {

      0%,
      100% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 8px 10px rgba(255, 82, 130, 0.2)) hue-rotate(0deg);
      }

      50% {
        transform: translateY(-5px) scale(1.02);
        filter: drop-shadow(0 15px 20px rgba(242, 131, 103, 0.5)) hue-rotate(30deg);
      }
    }

    /* 2. Efek Garis Merakit (Outline) */
    @keyframes coreOutline {
      0% {
        stroke-dashoffset: 800;
        opacity: 0;
        transform: scale(0.8);
      }

      5% {
        opacity: 1;
      }

      25% {
        stroke-dashoffset: 0;
        opacity: 1;
        transform: scale(1.05);
      }

      30%,
      100% {
        stroke-dashoffset: 0;
        opacity: 0;
        transform: scale(1.1);
      }
    }

    /* 3. Efek Warna Melompat (Fill Bounce) */
    @keyframes coreFill {

      0%,
      20% {
        opacity: 0;
        transform: scale(0.5);
        filter: brightness(1);
      }

      30% {
        opacity: 1;
        transform: scale(1.1);
        filter: brightness(1.3);
      }

      45%,
      85% {
        opacity: 1;
        transform: scale(1);
        filter: brightness(1);
      }

      90%,
      100% {
        opacity: 0;
        transform: scale(0.8);
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <noscript>Aktifkan JavaScript untuk menjalankan aplikasi ini.</noscript>

  <!-- App Shell Loader (hilang saat React mount) -->
  <div id="app-loader">
    <svg style="width: 100px; height: 100px; margin-bottom: 24px;" xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 100 100" width="100%" height="100%">
      <defs>
        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f28367" />
          <stop offset="100%" stop-color="#ff5282" />
        </linearGradient>
      </defs>

      <g class="hsse-splash">
        <path class="logo-outline" fill="none" stroke="url(#logoGradient)" stroke-width="3" stroke-linejoin="round"
          stroke-linecap="round"
          d="M 0 15 L 25 0 L 50 15 L 75 0 L 100 15 L 100 70 L 50 100 L 0 70 Z M 25 25 L 50 40 L 75 25 L 75 60 L 50 75 L 25 60 Z" />
        <path class="logo-fill" fill="url(#logoGradient)" fill-rule="evenodd"
          d="M 0 15 L 25 0 L 50 15 L 75 0 L 100 15 L 100 70 L 50 100 L 0 70 Z M 25 25 L 50 40 L 75 25 L 75 60 L 50 75 L 25 60 Z" />
      </g>
    </svg>
    <p
      style="color: #f8fafc; font-size: 20px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; animation: fadeIn 1s ease-in 1.5s forwards; opacity: 0;">
      MERAM PLATFORM
    </p>
    <p
      style="color: #94a3b8; font-size: 13px; margin-top: 8px; font-weight: 500; animation: fadeIn 1s ease-in 1.8s forwards; opacity: 0;">
      Loading workspace...
    </p>
  </div>

  <div id="root"></div>

  <script>
    // Tahan splash screen minimal 3 detik agar animasi bisa dilihat sempurna
    window.addEventListener('load', function () {
      setTimeout(function () {
        var loader = document.getElementById('app-loader');
        if (loader) loader.classList.add('hidden');
        setTimeout(function () {
          if (loader) loader.remove();
        }, 500);
      }, 3000);
    });

    // Handle URL params dari PWA shortcuts
    (function () {
      var params = new URLSearchParams(window.location.search);
      if (params.get('action') === 'create') {
        window.__PWA_OPEN_CREATE__ = true;
      }
      if (params.get('tab')) {
        window.__PWA_INITIAL_TAB__ = params.get('tab');
      }
      if (params.get('share') === '1') {
        window.__PWA_SHARE_INCOMING__ = true;
      }
    })();
  </script>
</body>

</html>
