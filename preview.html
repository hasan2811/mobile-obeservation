<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSSE.Tech Platform - Workflow Preview</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- React & ReactDOM from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            /* DARK THEME (DEFAULT) */
            --bg-main: #0f172a;
            --bg-surface: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary-color: #3b82f6;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --border-color: #334155;
            --glass-bg: rgba(30, 41, 59, 0.7);
        }

        .light-mode {
            --bg-main: #f8fafc;
            --bg-surface: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --glass-bg: rgba(255, 255, 255, 0.8);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(0);
            }
        }

        .animate-slide-in {
            animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-press:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- MOCK DATA ---
        const MOCK_USERS = [
            { id: 1, name: "Rully (You)", avatar: "R" },
            { id: 2, name: "Safety Officer", avatar: "S" },
            { id: 3, name: "Site Manager", avatar: "M" }
        ];

        // --- ICONS ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                home: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></svg>,
                plus: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14" /><path d="M12 5v14" /></svg>,
                list: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="8" y1="6" x2="21" y2="6" /><line x1="8" y1="12" x2="21" y2="12" /><line x1="8" y1="18" x2="21" y2="18" /><line x1="3" y1="6" x2="3.01" y2="6" /><line x1="3" y1="12" x2="3.01" y2="12" /><line x1="3" y1="18" x2="3.01" y2="18" /></svg>,
                user: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>,
                check: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12" /></svg>,
                clock: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>,
                x: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>,
                star: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></svg>,
                send: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" /></svg>,
                alert: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></svg>,
                refresh: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" /></svg>,
                chevronRight: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6" /></svg>,
                fileText: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /><polyline points="10 9 9 9 8 9" /></svg>,
                flash: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></svg>
            };
            return icons[name] || null;
        };

        // --- COMPONENTS ---

        // 1. ACTION STORY COMPONENT
        const ActionStory = ({ history }) => {
            return (
                <div className="pl-2 pt-2">
                    <div className="relative pl-6 space-y-6 before:absolute before:inset-0 before:ml-2.5 before:-translate-x-px before:h-full before:w-0.5 before:bg-gradient-to-b before:from-blue-500 before:via-purple-500 before:to-transparent">
                        {history.map((item, index) => (
                            <div key={index} className="relative group animate-fade-in" style={{ animationDelay: `${index * 100}ms` }}>
                                <div className={`absolute -left-6 w-5 h-5 rounded-full border-2 border-[#0f172a] flex items-center justify-center
                                ${item.action === 'Created' ? 'bg-blue-500' :
                                        item.action === 'Assigned' ? 'bg-purple-500' :
                                            item.action === 'Action Taken' ? 'bg-amber-500' :
                                                item.action === 'Reopened' ? 'bg-red-500' :
                                                    'bg-emerald-500'}`}>
                                    <Icon name={
                                        item.action === 'Created' ? 'plus' :
                                            item.action === 'Assigned' ? 'user' :
                                                item.action === 'Action Taken' ? 'clock' :
                                                    item.action === 'Reopened' ? 'refresh' : 'check'
                                    } size={10} className="text-white" />
                                </div>
                                <div className="glass-panel p-3 rounded-xl shadow-lg border-l-4 border-l-transparent hover:border-l-blue-400 transition-all">
                                    <div className="flex justify-between items-start mb-1">
                                        <h4 className="font-semibold text-sm text-white">{item.action}</h4>
                                        <span className="text-[10px] text-gray-400">{item.timestamp}</span>
                                    </div>
                                    <div className="flex items-center gap-2 mb-2">
                                        <div className="w-5 h-5 rounded-full bg-slate-700 flex items-center justify-center text-[10px] font-bold text-white">
                                            {item.user[0]}
                                        </div>
                                        <span className="text-xs text-gray-300">{item.user}</span>
                                    </div>
                                    {item.comment && (
                                        <div className="text-xs text-gray-400 italic bg-black/20 p-2 rounded-lg">
                                            "{item.comment}"
                                        </div>
                                    )}
                                    {item.rating && (
                                        <div className="flex gap-1 mt-1">
                                            {[...Array(5)].map((_, i) => (
                                                <Icon key={i} name="star" size={12} className={i < item.rating ? "text-yellow-400 fill-yellow-400" : "text-gray-600"} />
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // 2. OBSERVATION CARD
        const ObservationCard = ({ obs, isAssignee, isCreator, onTakeAction, onReview }) => {
            const statusColor = {
                'Open': 'bg-blue-500/20 text-blue-400 border-blue-500/30',
                'Pending': 'bg-amber-500/20 text-amber-400 border-amber-500/30',
                'Closed': 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30'
            }[obs.status] || 'bg-slate-500/20';

            return (
                <div className="glass-panel rounded-2xl p-4 mb-4 shadow-xl border border-gray-800">
                    <div className="flex justify-between items-start mb-3">
                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider border ${statusColor}`}>
                            {obs.status}
                        </span>
                        <span className="text-xs text-gray-500">{obs.history[0].timestamp}</span>
                    </div>

                    <h3 className="font-bold text-lg text-white mb-1">{obs.title}</h3>
                    <p className="text-sm text-gray-400 mb-4 line-clamp-2">{obs.description}</p>

                    <div className="flex justify-between items-center bg-black/20 p-2 rounded-xl mb-4">
                        <div className="flex items-center gap-2">
                            <div className="text-[10px] text-gray-500 uppercase">From</div>
                            <div className="flex items-center gap-1">
                                <span className="w-5 h-5 rounded-full bg-blue-600 flex items-center justify-center text-[10px] text-white">
                                    {obs.creatorName[0]}
                                </span>
                                <span className="text-xs text-gray-300 font-medium">{obs.creatorName}</span>
                            </div>
                        </div>
                        <Icon name="arrowRight" size={12} className="text-gray-600" />
                        <div className="flex items-center gap-2">
                            <div className="text-[10px] text-gray-500 uppercase">To</div>
                            <div className="flex items-center gap-1">
                                <span className="w-5 h-5 rounded-full bg-purple-600 flex items-center justify-center text-[10px] text-white">
                                    {obs.assigneeName[0]}
                                </span>
                                <span className="text-xs text-gray-300 font-medium">{obs.assigneeName}</span>
                            </div>
                        </div>
                    </div>

                    <details className="group">
                        <summary className="flex items-center gap-2 text-xs text-blue-400 font-medium cursor-pointer mb-3 select-none">
                            <Icon name="list" size={14} /> View Action Story
                            <Icon name="chevronRight" size={14} className="group-open:rotate-90 transition-transform" />
                        </summary>
                        <div className="pb-2">
                            <ActionStory history={obs.history} />
                        </div>
                    </details>

                    <div className="flex gap-2 mt-2">
                        {isAssignee && obs.status === 'Open' && (
                            <button
                                onClick={() => onTakeAction(obs.id)}
                                className="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white py-2 rounded-xl text-sm font-semibold shadow-lg shadow-blue-500/20 active:scale-95 transition-all flex items-center justify-center gap-2"
                            >
                                <Icon name="check" size={16} /> Take Action
                            </button>
                        )}
                        {isCreator && obs.status === 'Pending' && (
                            <button
                                onClick={() => onReview(obs.id)}
                                className="flex-1 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-white py-2 rounded-xl text-sm font-semibold shadow-lg shadow-amber-500/20 active:scale-95 transition-all flex items-center justify-center gap-2"
                            >
                                <Icon name="star" size={16} /> Review
                            </button>
                        )}
                        {obs.status === 'Closed' && (
                            <div className="flex-1 bg-emerald-500/10 border border-emerald-500/20 text-emerald-500 py-2 rounded-xl text-sm font-semibold flex items-center justify-center gap-2">
                                <Icon name="check" size={16} /> Completed
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        function App() {
            const [currentUser, setCurrentUser] = useState(MOCK_USERS[0]); // Default to "Rully"
            const [activeTab, setActiveTab] = useState('dashboard');
            const [observations, setObservations] = useState([
                {
                    id: 1,
                    title: "Leaking Pipe at Zone A",
                    description: "Water dripping constantly near the electrical panel.",
                    creatorId: 1,
                    creatorName: "Rully (You)",
                    assigneeId: 2,
                    assigneeName: "Safety Officer",
                    status: "Open",
                    history: [
                        { action: "Created", timestamp: "10:00 AM", user: "Rully (You)", comment: "Needs urgent fix" }
                    ]
                },
                {
                    id: 2,
                    title: "Blocked Emergency Exit",
                    description: "Boxes piled up in front of exit door B2.",
                    creatorId: 2,
                    creatorName: "Safety Officer",
                    assigneeId: 1,
                    assigneeName: "Rully (You)",
                    status: "Open", // Waiting for me
                    history: [
                        { action: "Created", timestamp: "Yesterday", user: "Safety Officer", comment: "" },
                        { action: "Assigned", timestamp: "Yesterday", user: "Safety Officer", comment: "Please clear this" }
                    ]
                }
            ]);

            // Form States
            const [showCreateModal, setShowCreateModal] = useState(false);
            const [newObsData, setNewObsData] = useState({ title: '', description: '', assigneeId: 2 });

            // Review Modal State
            const [reviewModal, setReviewModal] = useState({ show: false, obsId: null });
            const [tempReviewData, setTempReviewData] = useState({ action: 'close', comment: '', rating: 0 }); // Temporary state for modal

            // Reset modal data when opening
            useEffect(() => {
                if (reviewModal.show) {
                    setTempReviewData({ action: 'close', comment: '', rating: 0 });
                }
            }, [reviewModal.show]);


            // -- HANDLERS --

            const handleCreate = (e) => {
                e.preventDefault();
                const assignee = MOCK_USERS.find(u => u.id === parseInt(newObsData.assigneeId));
                const newObs = {
                    id: Date.now(),
                    title: newObsData.title,
                    description: newObsData.description,
                    creatorId: currentUser.id,
                    creatorName: currentUser.name,
                    assigneeId: assignee.id,
                    assigneeName: assignee.name,
                    status: 'Open',
                    history: [
                        { action: "Created", timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), user: currentUser.name },
                        { action: "Assigned", timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), user: currentUser.name, comment: `Assigned to ${assignee.name}` }
                    ]
                };
                setObservations([newObs, ...observations]);
                setShowCreateModal(false);
                setNewObsData({ title: '', description: '', assigneeId: 2 });
                setActiveTab('activity'); // Switch to see my created item
            };

            const handleTakeAction = (obsId) => {
                setObservations(prev => prev.map(obs => {
                    if (obs.id === obsId) {
                        return {
                            ...obs,
                            status: 'Pending',
                            history: [...obs.history, {
                                action: "Action Taken",
                                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                                user: currentUser.name,
                                comment: "Marked as done, waiting for review."
                            }]
                        };
                    }
                    return obs;
                }));
            };

            const submitReview = () => {
                setObservations(prev => prev.map(obs => {
                    if (obs.id === reviewModal.obsId) {
                        const newHistoryItem = {
                            action: tempReviewData.action === 'close' ? "Closed" : "Reopened",
                            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                            user: currentUser.name,
                            comment: tempReviewData.comment,
                            rating: tempReviewData.action === 'close' ? tempReviewData.rating : null
                        };
                        return {
                            ...obs,
                            status: tempReviewData.action === 'close' ? 'Closed' : 'Open',
                            history: [...obs.history, newHistoryItem]
                        };
                    }
                    return obs;
                }));
                setReviewModal({ show: false, obsId: null });
            };

            // -- VIEWS --

            const Dashboard = () => {
                const myPendingTasks = observations.filter(o => o.assigneeId === currentUser.id && o.status === 'Open').length;
                const myReviews = observations.filter(o => o.creatorId === currentUser.id && o.status === 'Pending').length;

                return (
                    <div className="p-5 pb-24 space-y-6 animate-fade-in">
                        <header className="flex justify-between items-center mb-6">
                            <div>
                                <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">Hi, {currentUser.name.split(' ')[0]}</h1>
                                <p className="text-sm text-gray-400">Welcome back</p>
                            </div>
                            <div className="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center font-bold text-white shadow-lg">
                                {currentUser.avatar}
                            </div>
                        </header>

                        <div className="grid grid-cols-2 gap-4">
                            <div
                                onClick={() => setActiveTab('tasks')}
                                className="glass-panel p-5 rounded-3xl relative overflow-hidden btn-press cursor-pointer border border-blue-500/20 hover:border-blue-500/50 transition-colors">
                                <div className="absolute top-0 right-0 p-3 opacity-10"><Icon name="list" size={60} /></div>
                                <div className="text-3xl font-bold text-white mb-1">{myPendingTasks}</div>
                                <div className="text-xs font-semibold uppercase tracking-wider text-blue-300">My Tasks</div>
                            </div>
                            <div
                                onClick={() => setActiveTab('activity')}
                                className="glass-panel p-5 rounded-3xl relative overflow-hidden btn-press cursor-pointer border border-purple-500/20 hover:border-purple-500/50 transition-colors">
                                <div className="absolute top-0 right-0 p-3 opacity-10"><Icon name="star" size={60} /></div>
                                <div className="text-3xl font-bold text-white mb-1">{myReviews}</div>
                                <div className="text-xs font-semibold uppercase tracking-wider text-purple-300">To Review</div>
                            </div>
                        </div>

                        <div>
                            <h2 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                                <Icon name="flash" size={18} className="text-yellow-400" /> Recent Updates
                            </h2>
                            <div className="space-y-4">
                                {observations.slice(0, 3).map(obs => (
                                    <ObservationCard key={obs.id} obs={obs} isAssignee={false} isCreator={false} />
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            const TasksView = () => {
                const tasks = observations.filter(o => o.assigneeId === currentUser.id);
                return (
                    <div className="p-5 pb-24 animate-fade-in">
                        <h2 className="text-xl font-bold text-white mb-6">My Tasks</h2>
                        {tasks.length === 0 ? (
                            <div className="text-center p-10 text-gray-500">No tasks assigned to you.</div>
                        ) : (
                            <div className="space-y-4">
                                {tasks.map(obs => (
                                    <ObservationCard
                                        key={obs.id}
                                        obs={obs}
                                        isAssignee={true}
                                        onTakeAction={handleTakeAction}
                                    />
                                ))}
                            </div>
                        )}
                    </div>
                );
            };

            const MyActivityView = () => {
                const activity = observations.filter(o => o.creatorId === currentUser.id);
                return (
                    <div className="p-5 pb-24 animate-fade-in">
                        <h2 className="text-xl font-bold text-white mb-6">My Observations</h2>
                        {activity.length === 0 ? (
                            <div className="text-center p-10 text-gray-500">You haven't reported anything yet.</div>
                        ) : (
                            <div className="space-y-4">
                                {activity.map(obs => (
                                    <ObservationCard
                                        key={obs.id}
                                        obs={obs}
                                        isCreator={true}
                                        onReview={(id) => setReviewModal({ show: true, obsId: id })}
                                    />
                                ))}
                            </div>
                        )}
                    </div>
                );
            };

            // -- MODALS --

            const CreateModal = () => (
                <div className="fixed inset-0 z-[60] flex items-end sm:items-center justify-center bg-black/80 backdrop-blur-sm animate-fade-in">
                    <div className="bg-[#1e293b] w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl border-t border-white/10 sm:border-t-0">
                        <div className="flex justify-between items-center mb-6">
                            <h3 className="text-xl font-bold text-white">New Observation</h3>
                            <button onClick={() => setShowCreateModal(false)} className="p-2 bg-slate-800 rounded-full text-gray-400"><Icon name="x" size={18} /></button>
                        </div>
                        <form onSubmit={handleCreate} className="space-y-4">
                            <div>
                                <label className="text-xs text-gray-400 uppercase font-bold block mb-2">Title</label>
                                <input
                                    required
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:border-blue-500 focus:outline-none placeholder-slate-600"
                                    placeholder="Brief title..."
                                    value={newObsData.title}
                                    onChange={e => setNewObsData({ ...newObsData, title: e.target.value })}
                                />
                            </div>
                            <div>
                                <label className="text-xs text-gray-400 uppercase font-bold block mb-2">Description</label>
                                <textarea
                                    required
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:border-blue-500 focus:outline-none h-24 resize-none placeholder-slate-600"
                                    placeholder="What did you observe?"
                                    value={newObsData.description}
                                    onChange={e => setNewObsData({ ...newObsData, description: e.target.value })}
                                />
                            </div>
                            <div>
                                <label className="text-xs text-gray-400 uppercase font-bold block mb-2">Assign To</label>
                                <div className="relative">
                                    <select
                                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:border-blue-500 focus:outline-none appearance-none"
                                        value={newObsData.assigneeId}
                                        onChange={e => setNewObsData({ ...newObsData, assigneeId: e.target.value })}
                                    >
                                        {MOCK_USERS.filter(u => u.id !== currentUser.id).map(u => (
                                            <option key={u.id} value={u.id}>{u.name}</option>
                                        ))}
                                    </select>
                                    <div className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none">▼</div>
                                </div>
                            </div>
                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl mt-4 shadow-lg shadow-blue-600/20">
                                Create & Assign
                            </button>
                        </form>
                    </div>
                </div>
            );

            const ReviewModal = () => (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
                    <div className="bg-[#1e293b] w-full max-w-sm rounded-[2rem] p-6 shadow-2xl border border-white/10 text-center relative overflow-hidden">

                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-500 to-blue-500"></div>

                        <h3 className="text-xl font-bold text-white mb-2 mt-2">Review Action</h3>
                        <p className="text-sm text-gray-400 mb-6 px-4">The assignee has completed this task. Please verify accordingly.</p>

                        <div className="flex bg-slate-900 rounded-xl p-1 mb-6 mx-2">
                            <button
                                onClick={() => setTempReviewData(prev => ({ ...prev, action: 'close' }))}
                                className={`flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all ${tempReviewData.action === 'close' ? 'bg-emerald-600 text-white shadow-lg' : 'text-gray-400 hover:text-white'}`}>
                                Confirm Close
                            </button>
                            <button
                                onClick={() => setTempReviewData(prev => ({ ...prev, action: 'reopen' }))}
                                className={`flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all ${tempReviewData.action === 'reopen' ? 'bg-red-600 text-white shadow-lg' : 'text-gray-400 hover:text-white'}`}>
                                Reopen
                            </button>
                        </div>

                        <div className="px-2 min-h-[120px]">
                            {tempReviewData.action === 'close' ? (
                                <div className="animate-fade-in">
                                    <label className="text-xs text-gray-400 uppercase font-bold block mb-3">Rate Service</label>
                                    <div className="flex justify-center gap-2 mb-4">
                                        {[1, 2, 3, 4, 5].map(star => (
                                            <button key={star} onClick={() => setTempReviewData(prev => ({ ...prev, rating: star }))} className="focus:outline-none text-3xl transition-transform hover:scale-110 active:scale-95">
                                                <span style={{ color: star <= tempReviewData.rating ? '#fbbf24' : '#334155' }}>★</span>
                                            </button>
                                        ))}
                                    </div>
                                    <p className="text-xs text-slate-500 h-4">{tempReviewData.rating > 0 ? (tempReviewData.rating === 5 ? "Excellent!" : "Thanks for rating") : "Tap a star to rate"}</p>
                                </div>
                            ) : (
                                <div className="animate-fade-in">
                                    <label className="text-xs text-gray-400 uppercase font-bold block mb-2 text-left">Reason for Reopening</label>
                                    <textarea
                                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:border-red-500 focus:outline-none resize-none h-24"
                                        placeholder="Why is this task not complete?"
                                        value={tempReviewData.comment}
                                        onChange={e => setTempReviewData(prev => ({ ...prev, comment: e.target.value }))}
                                    />
                                </div>
                            )}
                        </div>

                        <div className="flex gap-3 mt-6">
                            <button onClick={() => setReviewModal({ show: false, obsId: null })} className="flex-1 py-3 text-slate-400 font-medium hover:text-white rounded-xl hover:bg-slate-800 transition-colors">Cancel</button>
                            <button
                                onClick={submitReview}
                                disabled={tempReviewData.action === 'close' && tempReviewData.rating === 0}
                                className="flex-1 bg-white text-black font-bold rounded-xl py-3 hover:bg-gray-200 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                                Submit
                            </button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="max-w-md mx-auto min-h-screen bg-[#0f172a] shadow-2xl overflow-hidden relative pb-20">
                    {activeTab === 'dashboard' && <Dashboard />}
                    {activeTab === 'tasks' && <TasksView />}
                    {activeTab === 'activity' && <MyActivityView />}

                    {/* Bottom Nav */}
                    <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-panel border-t border-white/5 pb-6 pt-3 px-6 flex justify-between items-end z-40 bg-[#0f172a]/90 backdrop-blur-md">
                        <button
                            onClick={() => setActiveTab('dashboard')}
                            className={`flex flex-col items-center gap-1 w-16 ${activeTab === 'dashboard' ? 'text-blue-400' : 'text-gray-500 hover:text-gray-300'}`}>
                            <Icon name="home" size={24} />
                            <span className="text-[10px] font-medium">Home</span>
                        </button>
                        <button
                            onClick={() => setActiveTab('tasks')}
                            className={`flex flex-col items-center gap-1 w-16 ${activeTab === 'tasks' ? 'text-blue-400' : 'text-gray-500 hover:text-gray-300'}`}>
                            <div className="relative">
                                <Icon name="list" size={24} />
                                {observations.filter(o => o.assigneeId === currentUser.id && o.status === 'Open').length > 0 &&
                                    <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 rounded-full border border-[#0f172a]"></span>
                                }
                            </div>
                            <span className="text-[10px] font-medium">Tasks</span>
                        </button>

                        <div className="relative -top-5">
                            <button
                                onClick={() => setShowCreateModal(true)}
                                className="w-16 h-16 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/40 border-4 border-[#0f172a] transition-transform active:scale-95 hover:scale-105">
                                <Icon name="plus" size={32} />
                            </button>
                        </div>

                        <button
                            onClick={() => setActiveTab('activity')}
                            className={`flex flex-col items-center gap-1 w-16 ${activeTab === 'activity' ? 'text-blue-400' : 'text-gray-500 hover:text-gray-300'}`}>
                            <div className="relative">
                                <Icon name="fileText" size={24} />
                                {observations.filter(o => o.creatorId === currentUser.id && o.status === 'Pending').length > 0 &&
                                    <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-yellow-500 rounded-full border border-[#0f172a] animate-pulse"></span>
                                }
                            </div>
                            <span className="text-[10px] font-medium">Activity</span>
                        </button>
                        <button
                            className={`flex flex-col items-center gap-1 w-16 text-gray-500 opacity-50 cursor-not-allowed`}>
                            <Icon name="user" size={24} />
                            <span className="text-[10px] font-medium">Profile</span>
                        </button>
                    </div>

                    {showCreateModal && <CreateModal />}
                    {reviewModal.show && <ReviewModal />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
